[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-cli"
version = "1.0.0"
description = "Nexa AI Framework - Autonomous Coding Assistant"
authors = [
  { name="Nexa Team" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "colorama>=0.4.4",
    "rich>=10.0.0",
    "prompt_toolkit>=3.0.0",
    "inquirer>=3.1.3",
    "groq>=0.4.0",
    "openai>=1.0.0",
    "textual>=0.80",
    "PyYAML>=6.0"
]

[project.scripts]
nexa = "nexa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexa*"]

[tool.setuptools]
include-package-data = true
